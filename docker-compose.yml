# Postgres local para o ambiente LOCAL (pg_trgm já vem no pacote contrib da imagem oficial)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pizzaflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: ["./pgdata:/var/lib/postgresql/data"]
